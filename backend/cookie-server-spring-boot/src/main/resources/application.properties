spring.application.name=cookie.server

# Tomcat Thread Pool
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=20

# HikariCP Connection Pool (Standard 10 reicht nicht bei vielen gleichzeitigen Requests)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000

# ============================================
# APP-KONFIGURATION
# ============================================

# Dev-Modus: true = Browser-Zugriff erlaubt (DEV_PLAYER_001)
#            false = nur Electron/Steam erlaubt
app.dev-mode=true
# Admin-Token für geschützte Endpunkte (z. B. Season-Reset)
app.admin-token=change-me-in-production
# Optional -- Steam-Avatar-Resync (siehe SteamAvatarService). Leer = deaktiviert.
# Key: https://steamcommunity.com/dev/apikey -- in Produktion per Env-Var setzen, nie committen.
app.steam-web-api-key=
server.port=9876
# PostgreSQL-Datenbankverbindung
spring.datasource.url=jdbc:postgresql://localhost:5432/cookie
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA-Konfiguration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# MARKT-KONFIGURATION
# ============================================

# Preismodell: AMM (constant product, wie Uniswap). price = K / stock, K pro Ressource fix
# kalibriert auf initialStock^2 * initialPrice. Kein Preisdeckel/-boden noetig -- Kosten fuer
# einen Kauf gehen asymptotisch gegen unendlich, je naeher man den Pool leerkauft.

# Intervall in Millisekunden fuer den Stock-Fluktuations-Tick (Hintergrund-Marktaktivitaet)
market.update-interval-ms=2000

# Minimaler Preis - rein numerische Notbremse (verhindert negative/Null-Preise durch Rundung)
market.min-price=0.01

# Anteil des Ausgangsbestands, der pro Tick maximal als Phantom-Kauf/-Verkauf zufaellig
# zwischen Markt und Pool bewegt wird (0.02 = bis zu 2% des Ausgangsbestands pro Tick)
market.stock-fluctuation-ratio=0.02

# Zeitkonstante (Sekunden), mit der die Stock-Baseline (Rueckfall-Ziel des Zufalls-Ticks)
# von selbst zurueck auf initialStock zerfaellt, wenn keine weiteren Trades passieren.
# Reiner Anker-Zerfall gegen einen fixen Zielwert, daher stabil. Ein Preis-Ausschlag durch
# Spieler-Trading klingt damit binnen ~1-3h ab statt sofort (Standard: 3600 = 1h).
market.stock-baseline-time-constant-seconds=3600

# Anteil der Stock-Bewegung eines einzelnen echten Trades, der dauerhaft in die Baseline
# uebernommen wird (0.5 = Trade verschiebt Baseline um die Haelfte seiner eigenen Stock-
# Aenderung). Nur echte Trades duerfen die Baseline bewegen, nie der Zufalls-Tick selbst.
market.stock-baseline-trade-transfer-ratio=0.5

# Marktgebühr auf jeden Verkauf (0.15 = 15%)
market.sell-fee-rate=0.15

# Anti-Spam-Sperre nach jedem Trade: Anzahl Preis-Ticks, die ein Spieler nach einem Kauf/
# Verkauf abwarten muss, bevor der naechste Trade angenommen wird (global pro Spieler)
market.trade-cooldown-ticks=2

# Zeitfenster (Tage), innerhalb dessen ein Spieler als "aktiv" zaehlt fuer die
# Markt-Tiefen-Skalierung (siehe stock-per-active-player)
market.active-player-window-days=7

# Zusaetzliche Pool-Tiefe pro aktivem Spieler, auf initialStock aufaddiert -- verhindert dass
# ein einzelner Spieler den Markt im Alleingang leerkauft/manipuliert, sobald mehr Leute
# mitspielen. Startwert, braucht Fein-Tuning mit echten Spielerzahlen (siehe docs/ROADMAP.md 7.2)
market.stock-per-active-player=20000

# Startpreise fuer Ressourcen
market.initial-sugar-price=1.0
market.initial-flour-price=1.5
market.initial-eggs-price=2.0
market.initial-butter-price=3.0
market.initial-chocolate-price=5.0
market.initial-milk-price=1.2

# ============================================
# BALANCE-KONFIGURATION (Gebäude, Bürger, Prestige)
# ============================================

balance.base-storage-cap=100
balance.storage-per-level=1000
balance.citizens-per-rat-level=4
balance.citizen-base-cost=50
balance.citizen-cost-growth=1.15
balance.workers-per-level=1
balance.wage-per-min-per-worker=2.0
balance.debt-interest-rate=0.10
balance.debt-interest-rate-floor=0.02
balance.debt-limit-multiplier=8.0
balance.building-cost-growth=2.0
balance.passive-tick-seconds=5.0
balance.prestige-base-threshold=100000
balance.prestige-threshold-growth=1.5
balance.prestige-multiplier-per-level=0.1

# ============================================
# SPIELER-KONFIGURATION
# ============================================

# Startwerte fuer neue Spieler (2026-08-07 neu balanciert -- vorher startete jeder Spieler
# mit 1000 von JEDER Ressource (6000 total) bei nur 1100 Lagerkapazitaet (100 Basis + 1000
# fuer das vorgebaute Lager Stufe 1) -- das Lager war also schon vor dem ersten Klick 5x
# ueberfuellt. Jetzt: 0 Startressourcen (holt man sich per Hover-Ernte/Markt selbst), genug
# Cookies fuer GENAU eines der drei guenstigsten Produktionsgebaeude (Butterei 280, Bauernhof
# 300, Huhnerhof 350 -- Zuckerteich 500/Kuhstall 600 bleiben ein spaeteres Ziel), nicht fuer
# alle drei -- soll den Spieler zwingen, sich am Spielstart wirklich zu entscheiden statt
# einfach alles zu kaufen. Siehe docs/cookie-game-design.md Abschnitt 4/5.
player.initial-cookies=400.0
player.initial-sugar=0
player.initial-flour=0
player.initial-eggs=0
player.initial-butter=0
player.initial-chocolate=0
player.initial-milk=0
# Kostenlose Skill-Punkte bei Accounterstellung -- zaehlen nicht in totalSkillPointsBought
# (verzerren also nicht die Kostenkurve kuenftiger Kaeufe), sollen den Skill-Baum aber schon
# als Teil der allerersten Entscheidung relevant machen (Ressourcen-Fokus/Markt/Backen).
player.initial-skill-points=1

# ============================================
# SWAGGER / OPENAPI - in Produktion deaktiviert
# ============================================
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
